name: OpenTofu Proxmox

on:
  push:
    branches: [main]
    paths:
      - proxmox/**
      - .github/workflows/tofu-proxmox.yaml
      - .github/workflows/_tofu.yaml
      - .sops.yaml
      - .envrc
      - flake.nix
      - flake.lock
      - secrets.json
  pull_request:
    paths:
      - proxmox/**
      - .github/workflows/tofu-proxmox.yaml
      - .github/workflows/_tofu.yaml
      - .sops.yaml
      - .envrc
      - flake.nix
      - flake.lock
      - secrets.json

jobs:
  tofu:
    uses: ./.github/workflows/_tofu.yaml
    with:
      working-directory: proxmox
    secrets: inherit
    concurrency:
      group: tofu_latch_proxmox
      cancel-in-progress: false
