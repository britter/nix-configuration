name: OpenTofu DNS

on:
  push:
    branches: [main]
    paths:
      - dns/**
      - .github/workflows/tofu-dns.yaml
      - .github/workflows/_tofu.yaml
      - .sops.yaml
      - .envrc
      - flake.nix
      - flake.lock
      - secrets.json
  pull_request:
    paths:
      - dns/**
      - .github/workflows/tofu-dns.yaml
      - .github/workflows/_tofu.yaml
      - .sops.yaml
      - .envrc
      - flake.nix
      - flake.lock
      - secrets.json

jobs:
  tofu:
    uses: ./.github/workflows/_tofu.yaml
    with:
      working-directory: dns
    secrets: inherit
    concurrency:
      group: tofu_latch_dns
      cancel-in-progress: false
