name: OpenTofu Network

on:
  push:
    branches: [main]
    paths:
      - network/**
      - .github/workflows/tofu-network.yaml
      - .github/workflows/_tofu.yaml
      - .sops.yaml
      - .envrc
      - flake.nix
      - flake.lock
      - secrets.json
  pull_request:
    paths:
      - network/**
      - .github/workflows/tofu-network.yaml
      - .github/workflows/_tofu.yaml
      - .sops.yaml
      - .envrc
      - flake.nix
      - flake.lock
      - secrets.json

jobs:
  tofu:
    uses: ./.github/workflows/_tofu.yaml
    with:
      working-directory: network
