name: OpenTofu Object Storage

on:
  push:
    branches: [main]
    paths:
      - tofu/object-storage/**
      - tofu/.sops.yaml
      - modules/nix/dev-shell/**
      - modules/nix/treefmt.nix
      - modules/nix/pre-commit.nix
      - flake.nix
      - flake.lock
      - .github/workflows/tofu-object-storage.yaml
      - .github/workflows/_tofu.yaml
  pull_request:
    paths:
      - tofu/object-storage/**
      - tofu/.sops.yaml
      - modules/nix/dev-shell/**
      - modules/nix/treefmt.nix
      - modules/nix/pre-commit.nix
      - flake.nix
      - flake.lock
      - .github/workflows/tofu-object-storage.yaml
      - .github/workflows/_tofu.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  tofu:
    uses: ./.github/workflows/_tofu.yaml
    with:
      working-directory: tofu/object-storage
    secrets: inherit
    concurrency:
      group: tofu_latch_object-storage
      cancel-in-progress: false
