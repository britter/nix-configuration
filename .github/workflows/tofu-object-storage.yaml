name: OpenTofu Object Storage

on:
  push:
    branches: [main]
    paths:
      - object-storage/**
      - .github/workflows/tofu-object-storage.yaml
      - .github/workflows/_tofu.yaml
      - .sops.yaml
      - .envrc
      - flake.nix
      - flake.lock
      - secrets.json
  pull_request:
    paths:
      - object-storage/**
      - .github/workflows/tofu-object-storage.yaml
      - .github/workflows/_tofu.yaml
      - .sops.yaml
      - .envrc
      - flake.nix
      - flake.lock
      - secrets.json

permissions:
  contents: read
  pull-requests: write

jobs:
  tofu:
    uses: ./.github/workflows/_tofu.yaml
    with:
      working-directory: object-storage
    secrets: inherit
    concurrency:
      group: tofu_latch_object-storage
      cancel-in-progress: false
