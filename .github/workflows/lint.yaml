name: "Run nix flake check"

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "tofu/**", "docs/**" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "tofu/**", "docs/**" ]

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main
      - run: nix flake check
