name: "CI Build"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-system:
    name: Build system
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - configuration: framework-13
            runner: ubuntu-latest
          - configuration: srv-prod-1
            runner: ubuntu-latest
          - configuration: srv-prod-2
            runner: ubuntu-latest
          - configuration: srv-prod-3
            runner: ubuntu-latest
          - configuration: srv-prod-4
            runner: ubuntu-latest
          - configuration: srv-prod-5
            runner: ubuntu-latest
          - configuration: srv-prod-6
            runner: ubuntu-latest
          - configuration: srv-offsite-1
            runner: ubuntu-latest
          - configuration: directions
            runner: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main
      - run: nix build .#nixosConfigurations.${{ matrix.configuration }}.config.system.build.toplevel
  build-iso:
    name: Build ISOs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main
      - run: nix build .#nixosConfigurations.minimal-server-iso.config.system.build.isoImage
  build-home-manager:
    name: Build standalone home-manager config
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: ["bene"]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # main
      - run: nix build .#homeConfigurations.${{ matrix.configuration }}.activationPackage
